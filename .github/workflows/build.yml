name: Build Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows you to manually run the workflow from the Actions tab
  release:
    types: [published]  # Triggers the workflow when you publish a new release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: gomoku-balanced-linux
            asset_name: GomokuBalanced-Linux
          - os: windows-latest
            artifact_name: gomoku-balanced-windows
            asset_name: GomokuBalanced-Windows.exe
          - os: macos-latest
            artifact_name: gomoku-balanced-macos
            asset_name: GomokuBalanced-macOS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.13'  # Set the exact version you use

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pip install pyinstaller
        # This command builds the executable. It assumes your main.py is in the root.
        # You may need to adjust the --add-data paths.
        pyinstaller --onefile --windowed --name "${{ matrix.artifact_name }}" src/main.py --add-data "assets:assets"
      shell: bash

    - name: Upload artifact (for debugging)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.artifact_name }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/${{ matrix.artifact_name }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        asset_name: ${{ matrix.asset_name }}
        asset_content_type: application/octet-stream